<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receta | Nutrifit</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#28a745">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, h1, h2, h3, p, a, button, span, div, li { font-family: 'Poppins', sans-serif !important; }
        body { background: #f8f9fa; margin: 0; overflow-x: hidden; }
        .det { max-width: 900px; margin: 0 auto; padding: 88px 16px 48px; }
        .volver { display: inline-block; margin-bottom: 14px; color: #1e7a35; font-weight: 600; text-decoration: none; font-size: .9rem; }
        .ficha { background: #fff; border-radius: 20px; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.08); text-align: left; }
        @media (min-width: 700px) { .ficha { padding: 32px; } }
        .hero { display: grid; gap: 18px; margin-bottom: 28px; }
        @media (min-width: 700px) { .hero { grid-template-columns: 280px 1fr; align-items: center; } }
        .foto { position: relative; aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #dff3e5, #bfe8c9); }
        .foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .foto.sin-foto::after { content: "\f2e7"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 3rem; color: #28a745; opacity: .55; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag { background: #def5e4; color: #1e7a35; padding: 4px 10px; border-radius: 999px; font-size: .74rem; font-weight: 600; }
        h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 5vw, 2.2rem); color: #2d3436; line-height: 1.2; }
        .desc { margin: 0; color: #636e72; line-height: 1.6; }
        section { margin-bottom: 28px; }
        h2 { margin: 0 0 14px; font-size: 1.2rem; color: #2d3436; }
        .nut-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }
        .nut-head h2 { margin: 0; }
        #ojo { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1.5px solid #28a745; border-radius: 999px; background: #fff; color: #1e7a35; font-weight: 600; font-size: .85rem; cursor: pointer; }
        #ojo[aria-pressed="true"] { background: #28a745; color: #fff; }
        .peq { margin: 0 0 14px; color: #636e72; font-size: .8rem; }
        .nut { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        @media (min-width: 700px) { .nut { grid-template-columns: repeat(4, 1fr); } }
        .dato { color: #fff; padding: 16px 10px; border-radius: 12px; text-align: center; }
        .dato small { display: block; font-size: .8rem; opacity: .92; }
        .dato strong { display: block; font-size: 1.5rem; margin-top: 2px; letter-spacing: .02em; }
        ul.ing { list-style: none; padding: 0; margin: 0; }
        ul.ing li { padding: 11px 0; border-bottom: 1px solid #eee; color: #4a5558; }
        ul.ing li::before { content: "✓"; color: #28a745; font-weight: 700; margin-right: 10px; }
        ol.pasos { padding-left: 0; margin: 0; list-style: none; counter-reset: p; }
        ol.pasos li { counter-increment: p; display: flex; gap: 12px; padding: 12px 0; color: #4a5558; line-height: 1.6; }
        ol.pasos li::before { content: counter(p); flex: none; width: 28px; height: 28px; border-radius: 50%; background: #28a745; color: #fff; font-weight: 700; font-size: .85rem; display: flex; align-items: center; justify-content: center; }
        .nota { margin: 0; padding: 12px 14px; border-radius: 12px; background: #fff6e0; color: #7a5600; font-size: .82rem; line-height: 1.5; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-leaf"></i> NUTRI<span>FIT</span></div>
        <div style="display: flex; gap: 15px; margin-left: auto;">
            <a href="recetas.html" class="nav-link">Recetas</a>
            <a href="index.html" class="nav-link">Inicio</a>
        </div>
    </nav>

    <main class="det">
        <a class="volver" id="volver" href="recetas.html"><i class="fa-solid fa-arrow-left"></i> Ver recetas</a>
        <article class="ficha" id="ficha">
            <div class="hero">
                <div class="foto" id="foto"></div>
                <div><div class="tags" id="tags"></div><h1 id="titulo"></h1><p class="desc" id="desc"></p></div>
            </div>
            <section>
                <div class="nut-head">
                    <h2>Datos nutricionales</h2>
                    <button id="ojo" type="button" aria-pressed="false"><i class="fa-solid fa-eye-slash"></i><span>Mostrar</span></button>
                </div>
                <p class="peq">Valores aproximados por porción.</p>
                <div class="nut" id="nut"></div>
            </section>
            <section><h2>Ingredientes</h2><ul class="ing" id="ing"></ul></section>
            <section><h2>Modo de preparación</h2><ol class="pasos" id="pasos"></ol></section>
            <p class="nota" id="nota" hidden></p>
        </article>
    </main>

    <script src="recetas-data.js"></script>
    <script>
        var $ = function (id) { return document.getElementById(id); };
        var q = new URLSearchParams(location.search);
        var id = parseInt(q.get("id"), 10);
        var r = RECETAS.filter(function (x) { return x.id === id; })[0];
        var cat = q.get("cat");
        if (cat && cat !== "todas") $("volver").href = "recetas.html#" + cat;

        if (!r) {
            $("ficha").innerHTML = '<h1>No encontramos esa receta</h1><p class="desc">Regresa a la lista y elige otra.</p>';
        } else {
            document.title = r.titulo + " | Nutrifit";
            $("titulo").textContent = r.titulo;
            $("desc").textContent = r.desc;
            r.tags.forEach(function (t) { var s = document.createElement("span"); s.className = "tag"; s.textContent = t; $("tags").appendChild(s); });

            var img = new Image();
            img.alt = r.titulo;
            img.referrerPolicy = "no-referrer";
            img.onerror = function () { img.remove(); $("foto").classList.add("sin-foto"); };
            img.src = r.imagen;
            $("foto").appendChild(img);

            r.ingredientes.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; $("ing").appendChild(li); });
            r.pasos.forEach(function (x) { var li = document.createElement("li"); li.textContent = x; $("pasos").appendChild(li); });

            var notas = [];
            CATEGORIAS.forEach(function (c) { if (c.nota && r.categorias.indexOf(c.id) > -1 && notas.indexOf(c.nota) < 0) notas.push(c.nota); });
            if (notas.length) { $("nota").textContent = notas.join(" ") + " Esta información es general y no sustituye la indicación de tu médico o nutriólogo."; $("nota").hidden = false; }

            var DATOS = [["Calorías", "calorias", "#28a745, #1e8a38"], ["Proteína", "proteina", "#3498db, #2980b9"], ["Carbohidratos", "carbos", "#e74c3c, #c0392b"], ["Grasas", "grasas", "#f39c12, #e67e22"]];
            var visible = false;
            try { visible = localStorage.getItem("nutrifit_ver_nutricion") === "1"; } catch (e) {}

            function pintarNutricion() {
                $("nut").textContent = "";
                DATOS.forEach(function (d) {
                    var box = document.createElement("div");
                    box.className = "dato";
                    box.style.background = "linear-gradient(135deg, " + d[2] + ")";
                    var s = document.createElement("small"); s.textContent = d[0];
                    var v = document.createElement("strong"); v.textContent = visible ? r.nutricion[d[1]] : "•••";
                    box.appendChild(s); box.appendChild(v);
                    $("nut").appendChild(box);
                });
                $("ojo").setAttribute("aria-pressed", visible);
                $("ojo").setAttribute("aria-label", visible ? "Ocultar datos nutricionales" : "Mostrar datos nutricionales");
                $("ojo").firstChild.className = "fa-solid " + (visible ? "fa-eye" : "fa-eye-slash");
                $("ojo").lastChild.textContent = visible ? "Ocultar" : "Mostrar";
            }
            $("ojo").addEventListener("click", function () {
                visible = !visible;
                try { localStorage.setItem("nutrifit_ver_nutricion", visible ? "1" : "0"); } catch (e) {}
                pintarNutricion();
            });
            pintarNutricion();
        }
    </script>
</body>
</html>
