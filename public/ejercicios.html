<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios | Nutrifit</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#28a745">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; background: linear-gradient(to bottom, #ffffff, #f0fdf4); overflow-x: hidden; }
        .ej-wrap, .ej-wrap *, #hoja, #hoja * { font-family: 'Poppins', sans-serif; box-sizing: border-box; }
        .ej-wrap { max-width: 720px; margin: 0 auto; padding: 92px 16px 90px; text-align: left; color: #2d3436; }
        .ej-wrap h1 { margin: 0 0 6px; font-size: clamp(1.5rem, 6vw, 2rem); line-height: 1.2; }
        .ej-sub { margin: 0 0 16px; color: #636e72; font-size: .92rem; }
        .ej-aviso { margin: 22px 0 0; padding: 12px 14px; border-radius: 12px; background: #fff6e0; color: #7a5600; font-size: .78rem; line-height: 1.5; }
        .ej-hero { padding: 28px 22px; border-radius: 24px; color: #fff; background: linear-gradient(135deg, #28a745, #1e8a38); }
        .ej-hero p { margin: 0 0 20px; opacity: .95; line-height: 1.6; }
        .ej-btn { display: block; width: 100%; min-height: 50px; padding: 0 20px; margin-top: 10px; border: 2px solid #28a745; border-radius: 999px; background: #28a745; color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .ej-btn.sec { background: #fff; color: #1e7a35; }
        .ej-btn.blanco { background: #fff; color: #1e7a35; border-color: #fff; }
        .ej-btn.borde { background: transparent; color: #fff; border-color: #fff; }
        .ej-btn:disabled { opacity: .45; cursor: default; }
        .ej-nav { display: grid; gap: 10px; margin-top: 18px; }
        @media (min-width: 520px) { .ej-nav { grid-template-columns: 1fr 1fr; } .ej-btn { margin-top: 0; } }
        .ej-prog { height: 8px; border-radius: 999px; background: #dff3e5; overflow: hidden; margin-bottom: 14px; }
        .ej-prog i { display: block; height: 100%; background: #28a745; border-radius: 999px; transition: width .3s; }
        .ej-paso { margin: 0 0 6px; font-size: .78rem; font-weight: 600; color: #28a745; text-transform: uppercase; letter-spacing: .08em; }
        .ej-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        @media (min-width: 520px) { .ej-grid { grid-template-columns: repeat(3, 1fr); } }
        .ej-op { display: block; width: 100%; margin: 0 0 10px; padding: 14px 16px; text-align: left; border: 2px solid #d9eedf; border-radius: 16px; background: #fff; color: #2d3436; cursor: pointer; font-size: 1rem; }
        .ej-grid .ej-op { margin: 0; text-align: center; }
        .ej-op b { display: block; font-weight: 600; }
        .ej-op span { display: block; margin-top: 4px; font-size: .82rem; line-height: 1.5; color: #636e72; }
        .ej-op.on { border-color: #28a745; background: #effaf2; box-shadow: 0 0 0 1px #28a745 inset; }
        .ej-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
        .ej-tabs::-webkit-scrollbar { display: none; }
        .ej-tab { flex: none; min-height: 42px; padding: 0 18px; border: 2px solid #28a745; border-radius: 999px; background: #fff; color: #1e7a35; font-weight: 600; cursor: pointer; }
        .ej-tab.on { background: #28a745; color: #fff; }
        .ej-dia { margin: 20px 0 12px; font-size: 1.15rem; }
        .ej-lista { display: grid; gap: 12px; }
        @media (min-width: 640px) { .ej-lista { grid-template-columns: 1fr 1fr; } }
        .ej-card { text-align: left; padding: 16px; border: 2px solid #e5e7eb; border-radius: 18px; background: #fff; cursor: pointer; color: #2d3436; }
        .ej-card:active { border-color: #28a745; }
        .ej-card b { display: block; font-size: 1rem; margin-bottom: 6px; }
        .ej-card span { display: inline-block; padding: 4px 12px; border-radius: 999px; background: #def5e4; color: #1e7a35; font-size: .85rem; font-weight: 600; }
        .ej-card small { display: block; margin-top: 8px; color: #8a9396; font-size: .75rem; }
        .ej-acc { margin-bottom: 10px; border: 2px solid #e5e7eb; border-radius: 14px; background: #fff; }
        .ej-acc summary { padding: 14px 16px; font-weight: 600; cursor: pointer; }
        .ej-acc p { margin: 0; padding: 0 16px 16px; color: #636e72; font-size: .9rem; line-height: 1.6; }
        #hoja { position: fixed; inset: 0; z-index: 3500; display: flex; align-items: flex-end; justify-content: center; }
        #hoja[hidden] { display: none; }
        .ej-fondo { position: absolute; inset: 0; background: rgba(0,0,0,.5); }
        .ej-panel { position: relative; width: min(560px, 100%); max-height: 86dvh; overflow-y: auto; padding: 22px 18px calc(22px + env(safe-area-inset-bottom, 0px)); border-radius: 24px 24px 0 0; background: #fff; color: #2d3436; text-align: left; }
        .ej-panel h2 { margin: 0 0 8px; font-size: 1.25rem; }
        .ej-panel p { margin: 0 0 12px; color: #636e72; line-height: 1.6; font-size: .92rem; }
        .ej-tag { display: inline-block; padding: 3px 12px; border-radius: 999px; background: #def5e4; color: #1e7a35 !important; font-size: .78rem !important; font-weight: 600; }
        .ej-dato { padding: 10px 14px; border-radius: 12px; background: #f0fdf4; color: #1e7a35 !important; font-weight: 600; }
        .ej-panel .ej-btn { margin-top: 10px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-leaf"></i> NUTRI<span>FIT</span></div>
        <div class="nav-menu">
            <a href="index.html" class="nav-link" style="font-weight: 600;"><i class="fa-solid fa-arrow-left"></i> VOLVER</a>
        </div>
    </nav>

    <main class="ej-wrap" id="app"></main>

    <script src="ejercicios-data.js"></script>
    <script src="ejercicios.js"></script>
</body>
</html>
