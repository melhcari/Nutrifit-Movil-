<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas | Nutrifit</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#28a745">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, h1, h2, h3, p, a, button, span, div { font-family: 'Poppins', sans-serif !important; }
        body { background: #f8f9fa; margin: 0; overflow-x: hidden; }
        .rec-head { background: linear-gradient(135deg, #28a745, #1e8a38); color: #fff; padding: 96px 20px 28px; }
        .rec-head h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 5vw, 2.5rem); }
        .rec-head p { margin: 0; opacity: .92; line-height: 1.5; max-width: 640px; }
        .rec-wrap { max-width: 1200px; margin: 0 auto; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 16px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex: none; border: 1.5px solid #cfe9d6; background: #fff; color: #2d3436; padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: .88rem; cursor: pointer; }
        .chip.on { background: #28a745; border-color: #28a745; color: #fff; }
        @media (min-width: 900px) { .chips { flex-wrap: wrap; overflow: visible; } }
        .info { margin: 0; padding: 0 16px 6px; color: #636e72; font-size: .88rem; line-height: 1.5; }
        .info b { color: #28a745; }
        .rec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; padding: 14px 16px 48px; }
        .rec-card { display: block; background: #fff; border-radius: 16px; overflow: hidden; text-decoration: none; color: inherit; box-shadow: 0 4px 14px rgba(0,0,0,.08); transition: transform .2s, box-shadow .2s; }
        .rec-card:active { transform: scale(.985); }
        @media (hover: hover) { .rec-card:hover { transform: translateY(-4px); box-shadow: 0 10px 24px rgba(0,0,0,.14); } }
        .rec-img { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(135deg, #dff3e5, #bfe8c9); }
        .rec-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .rec-img.sin-foto::after { content: "\f2e7"; font-family: "Font Awesome 6 Free"; font-weight: 900; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; color: #28a745; opacity: .55; }
        .rec-body { padding: 16px; text-align: left; }
        .rec-body h3 { margin: 0 0 6px; font-size: 1.05rem; color: #2d3436; }
        .rec-body p { margin: 0 0 12px; color: #636e72; font-size: .85rem; line-height: 1.5; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; }
        .tag { background: #def5e4; color: #1e7a35; padding: 4px 10px; border-radius: 999px; font-size: .74rem; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo"><i class="fa-solid fa-leaf"></i> NUTRI<span>FIT</span></div>
        <a href="index.html" class="nav-link" style="margin-left: auto;"><i class="fa-solid fa-arrow-left"></i> Volver</a>
    </nav>

    <header class="rec-head">
        <h1>Recetas saludables</h1>
        <p>Elige la categoría que va contigo y descubre recetas fáciles, con ingredientes, preparación y datos nutricionales.</p>
    </header>

    <div class="rec-wrap">
        <div class="chips" id="chips" role="tablist" aria-label="Categorías de recetas"></div>
        <p class="info" id="info"></p>
        <div class="rec-grid" id="grid"></div>
    </div>

    <script src="recetas-data.js"></script>
    <script>
        var $ = function (id) { return document.getElementById(id); };
        var actual = "todas";

        function pintar(cat) {
            actual = cat;
            var c = CATEGORIAS.filter(function (x) { return x.id === cat; })[0] || CATEGORIAS[0];
            var lista = RECETAS.filter(function (r) { return cat === "todas" || r.categorias.indexOf(cat) > -1; });
            document.querySelectorAll(".chip").forEach(function (b) {
                var on = b.dataset.id === cat;
                b.classList.toggle("on", on);
                b.setAttribute("aria-selected", on);
            });
            $("info").innerHTML = "<b>" + lista.length + " recetas.</b> " + c.desc;
            $("grid").textContent = "";
            lista.forEach(function (r) {
                var a = document.createElement("a");
                a.className = "rec-card";
                a.href = "receta.html?id=" + r.id + "&cat=" + cat;
                var foto = document.createElement("div");
                foto.className = "rec-img";
                var img = new Image();
                img.alt = r.titulo;
                img.loading = "lazy";
                img.referrerPolicy = "no-referrer";
                img.onerror = function () { img.remove(); foto.classList.add("sin-foto"); };
                img.src = r.imagen;
                foto.appendChild(img);
                var cuerpo = document.createElement("div");
                cuerpo.className = "rec-body";
                var h = document.createElement("h3"); h.textContent = r.titulo;
                var p = document.createElement("p"); p.textContent = r.desc;
                var t = document.createElement("div"); t.className = "tags";
                r.tags.forEach(function (x) { var s = document.createElement("span"); s.className = "tag"; s.textContent = x; t.appendChild(s); });
                cuerpo.appendChild(h); cuerpo.appendChild(p); cuerpo.appendChild(t);
                a.appendChild(foto); a.appendChild(cuerpo);
                $("grid").appendChild(a);
            });
            history.replaceState(null, "", cat === "todas" ? location.pathname : "#" + cat);
        }

        CATEGORIAS.forEach(function (c) {
            var b = document.createElement("button");
            b.className = "chip";
            b.type = "button";
            b.dataset.id = c.id;
            b.setAttribute("role", "tab");
            b.textContent = c.nombre;
            b.addEventListener("click", function () { pintar(c.id); });
            $("chips").appendChild(b);
        });

        var inicial = location.hash.slice(1);
        pintar(CATEGORIAS.some(function (c) { return c.id === inicial; }) ? inicial : "todas");
        window.addEventListener("hashchange", function () {
            var h = location.hash.slice(1);
            if (h && h !== actual && CATEGORIAS.some(function (c) { return c.id === h; })) pintar(h);
        });
    </script>
</body>
</html>
